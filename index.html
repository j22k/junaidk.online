<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e100f" />
    <meta name="color-scheme" content="dark" />
    <title>Junaid — AI Engineer</title>
    <meta name="description" content="Muhammed Junaid K. — AI Engineer. RAG pipelines, LLM apps and ML systems on AWS, shipped end to end." />
    <meta property="og:title" content="Junaid — AI Engineer" />
    <meta property="og:description" content="I build AI that ships end to end." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      #splash{position:fixed;inset:0;z-index:9999;background:#0e100f;display:grid;place-content:center;justify-items:center;gap:22px;transition:opacity .4s ease}
      #splash.out{opacity:0;pointer-events:none}
      #splash .word{display:flex;align-items:center;gap:2px;font:700 clamp(2.4rem,9vw,4.5rem)/1 "Space Grotesk",system-ui,sans-serif;letter-spacing:-.04em;color:#fffce1;transform:skewX(-9deg)}
      #splash .word span{display:inline-block;opacity:0;transform:translateY(60%);animation:splash-rise .7s cubic-bezier(.16,1,.3,1) forwards}
      #splash .dot{width:.2em;height:.2em;border-radius:50%;background:#ff3b3b;margin-left:.08em;box-shadow:0 0 12px 2px rgba(255,59,59,.8);transform:scale(0);animation:splash-pop .5s cubic-bezier(.34,1.56,.64,1) .6s forwards,splash-blink 2.4s ease-in-out 1.1s infinite}
      #splash .bar{width:min(220px,50vw);height:3px;border-radius:3px;background:rgba(255,252,225,.10);overflow:hidden}
      #splash .bar i{display:block;height:100%;width:50%;background:linear-gradient(100deg,#0ae448 0%,#abff84 45%,#fec5fb 100%);animation:splash-sweep 1.2s ease-in-out infinite}
      @keyframes splash-rise{to{opacity:1;transform:none}}
      @keyframes splash-pop{to{transform:scale(1)}}
      @keyframes splash-blink{50%{opacity:.35;transform:scale(.7)}}
      @keyframes splash-sweep{from{transform:translateX(-100%)}to{transform:translateX(200%)}}
      @media (prefers-reduced-motion:reduce){#splash .word span,#splash .dot{animation:none;opacity:1;transform:none}#splash .bar i{animation:none;width:100%}}
      html,body{background:#0e100f;margin:0}
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading">
      <div class="word" aria-hidden="true"></div>
      <div class="bar" aria-hidden="true"><i></i></div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var w = document.querySelector("#splash .word");
        "junaid".split("").forEach(function (c, i) {
          var s = document.createElement("span");
          s.textContent = c;
          s.style.animationDelay = 0.08 + i * 0.045 + "s";
          w.appendChild(s);
        });
        var d = document.createElement("i");
        d.className = "dot";
        w.appendChild(d);
        window.__splashStart = performance.now();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
